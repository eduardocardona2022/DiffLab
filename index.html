<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DiffLab: compara dos textos, archivos o fragmentos de código con resaltado de sintaxis."
    />
    <meta name="theme-color" content="#070b14" />
    <title>DiffLab — Comparador de texto</title>
    <script>
      ;(() => {
        try {
          const raw = localStorage.getItem('difflab:v1')
          const saved = raw ? JSON.parse(raw) : null
          const theme =
            saved && (saved.theme === 'light' || saved.theme === 'dark')
              ? saved.theme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          const locale = saved && saved.locale === 'en' ? 'en' : 'es'
          document.documentElement.dataset.theme = theme
          document.documentElement.lang = locale
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', theme === 'dark' ? '#070b14' : '#f3f5fb')
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
